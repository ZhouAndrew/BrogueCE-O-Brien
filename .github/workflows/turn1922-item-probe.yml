name: Turn1922 item-state probe

on:
  push:
    branches:
      - fix/longsave-turn3-replay
    paths:
      - 'forensic_turn1922_item_probe.py'
      - '.github/workflows/turn1922-item-probe.yml'
      - 'forensic_missing_c_replay.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_obrien_mod_v0_2_28.py
      - run: python3 forensic_missing_c_replay.py
      - run: python3 forensic_turn1922_item_probe.py
      - run: python3 diag_longsave_matrix.py
      - run: make -B -j3 GRAPHICS=NO bin/brogue
      - name: Replay until second divergence
        shell: bash
        run: |
          set +e
          OBRIEN_MATRIX_DIAG=1 ./bin/brogue --variant obrien -o demo/OBrien_3727turn_longsave_backup.broguesave 2>&1 | tee turn1922.log
          code=$?
          echo "TURN1922_EXIT=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: turn1922-item-probe
          path: turn1922.log
