name: O'Brien embedded 3727-turn demo

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - fix/longsave-turn3-replay
      - demo/embedded-3727-save
    paths:
      - 'demo/**'
      - 'repair_legacy_obrien_save.py'
      - 'apply_obrien_mod_v0_2_29.py'
      - '.github/workflows/demo-embedded-save.yml'

permissions:
  contents: write

jobs:
  materialize-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Materialize and verify exact historical save
        run: |
          python3 demo/materialize_save.py
          test "$(stat -c %s demo/OBrien_3727turn_longsave_backup.broguesave)" = "20507"
          echo "dadc44db70a6b029e7be9dee422acc96d9a6b9063837c897305c335ee444b76d  demo/OBrien_3727turn_longsave_backup.broguesave" | sha256sum -c -

      - name: Check in materialized historical fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x demo/run-demo.sh
          git add -f demo/OBrien_3727turn_longsave_backup.broguesave demo/run-demo.sh
          git update-index --chmod=+x demo/run-demo.sh
          if ! git diff --cached --quiet; then
            git commit -m "Demo: materialize exact 3727-turn historical save"
            git push
          fi

      - name: Create deterministic repaired runtime fixture
        run: |
          python3 repair_legacy_obrien_save.py             demo/OBrien_3727turn_longsave_backup.broguesave             --output /tmp/OBrien_3727turn_repaired.broguesave
          test "$(stat -c %s /tmp/OBrien_3727turn_repaired.broguesave)" = "20630"
          echo "6ec2dd4a57b9dac8015b09cc84004ffd499d5e50a5ef59be162f3b7dae5138c0  /tmp/OBrien_3727turn_repaired.broguesave" | sha256sum -c -

      - name: Install SDL build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev

      - name: Apply O'Brien v0.2.29
        run: python3 apply_obrien_mod_v0_2_29.py

      - name: Build demo binary
        run: make -B -j3 bin/brogue

      - name: Smoke-test binary identity
        run: ./bin/brogue --version

      - name: Package runnable demo
        run: |
          mkdir -p artifact/bin artifact/demo
          cp bin/brogue artifact/bin/
          cp -a bin/assets artifact/bin/
          cp demo/OBrien_3727turn_longsave_backup.broguesave artifact/demo/
          cp /tmp/OBrien_3727turn_repaired.broguesave artifact/demo/
          cp demo/materialize_save.py artifact/demo/
          cp demo/save.b64.part* artifact/demo/
          cp demo/run-demo.sh artifact/demo/
          cp demo/README.md artifact/demo/
          cp repair_legacy_obrien_save.py artifact/
          printf '%s\n'             'Run from the artifact root:'             '  ./demo/run-demo.sh'             ''             'The historical 20,507-byte fixture is preserved unchanged.'             'The launcher creates/uses the deterministic 20,630-byte repaired copy.'             > artifact/README.txt

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: obrien-v029-embedded-3727-demo
          path: artifact
