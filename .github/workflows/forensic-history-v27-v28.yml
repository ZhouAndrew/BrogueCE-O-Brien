name: Forensic historical v27 v28 null builds
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/forensic-history-v27-v28.yml'
      - 'forensic_history_outcome.py'

jobs:
  v27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_obrien_mod_v0_2_27.py
      - run: python3 forensic_history_outcome.py
      - run: make -B -j3 GRAPHICS=NO bin/brogue
      - run: mkdir -p artifact && cp bin/brogue artifact/brogue-v0.2.27
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-history-v0.2.27
          path: artifact
  v28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_obrien_mod_v0_2_28.py
      - run: python3 forensic_history_outcome.py
      - run: make -B -j3 GRAPHICS=NO bin/brogue
      - run: mkdir -p artifact && cp bin/brogue artifact/brogue-v0.2.28
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-history-v0.2.28
          path: artifact
