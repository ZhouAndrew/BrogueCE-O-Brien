name: "O'Brien Mod v0.2.22"
on:
  push:
    branches: [ master ]
    paths:
      - 'apply_obrien_mod*.py'
      - '.github/workflows/obrien-mod-v0222.yml'
      - 'OBRIEN_MOD.md'
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply O'Brien v0.2.22 twice
        run: |
          python3 apply_obrien_mod_v0_2_22.py
          python3 apply_obrien_mod_v0_2_22.py
      - name: Verify v0.2.22 gameplay markers
        run: |
          grep -q 'v0.2.22 permanent crew' src/brogue/Monsters.c
          grep -q 'v0.2.22 old-save repair' src/brogue/Monsters.c
          grep -q '#define OBRIEN_SUPPLY_INTERVAL 3' src/brogue/RogueMain.c
          grep -q 'v0.2.22 three-depth Starfleet resupply' src/brogue/RogueMain.c
          test "$(grep -c 'CHARM_HEALTH, 1, 2, anchor' src/brogue/RogueMain.c)" -ge 3
          grep -q 'STAFF_PROTECTION, 1, 3, anchor' src/brogue/RogueMain.c
          grep -q 'STAFF_HASTE, 1, 3, anchor' src/brogue/RogueMain.c
          grep -q 'POTION_LIFE, 1, 0, anchor' src/brogue/RogueMain.c
          grep -q 'FOOD, FRUIT, 1, 0, anchor' src/brogue/RogueMain.c
          grep -q "O'Brien Must Survive v0.2.22" src/brogue/RogueMain.c
      - name: Compile
        run: make -B -j3 bin/brogue
