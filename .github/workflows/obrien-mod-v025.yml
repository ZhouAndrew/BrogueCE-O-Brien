name: "O'Brien Mod v0.2.16"
on:
  push:
    branches: [ master ]
    paths:
      - 'apply_obrien_mod.py'
      - 'apply_obrien_mod_v0_2_1.py'
      - 'apply_obrien_mod_v0_2_2.py'
      - 'apply_obrien_mod_v0_2_3.py'
      - 'apply_obrien_mod_v0_2_4.py'
      - 'apply_obrien_mod_v0_2_5.py'
      - 'apply_obrien_mod_v0_2_6.py'
      - 'apply_obrien_mod_v0_2_7.py'
      - 'apply_obrien_mod_v0_2_8.py'
      - 'apply_obrien_mod_v0_2_9.py'
      - 'apply_obrien_mod_v0_2_10.py'
      - 'apply_obrien_mod_v0_2_11.py'
      - 'apply_obrien_mod_v0_2_12.py'
      - 'apply_obrien_mod_v0_2_13.py'
      - 'apply_obrien_mod_v0_2_14.py'
      - 'apply_obrien_mod_v0_2_15.py'
      - 'apply_obrien_mod_v0_2_16.py'
      - '.github/workflows/obrien-mod-v025.yml'
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply O'Brien v0.2.16
        run: python3 apply_obrien_mod_v0_2_16.py
      - name: Verify v0.2.16 markers
        run: |
          grep -q 'Full tricorder identification: type, enchantment, runic and curse state' src/brogue/Items.c
          grep -q 'Bashir carries a finite poison staff' src/brogue/RogueMain.c
          grep -q 'return min(20, distance);' src/brogue/PowerTables.c
          grep -q 'v0.2.9 AoE gas resupply' src/brogue/RogueMain.c
          grep -q 'POTION_POISON, 2, 0' src/brogue/RogueMain.c
          grep -q 'POTION_PARALYSIS, 2, 0' src/brogue/RogueMain.c
          grep -q 'POTION_CONFUSION, 2, 0' src/brogue/RogueMain.c
          grep -q 'v0.2.11 mission-ready start' src/brogue/RogueMain.c
          grep -q 'obrienLoadStartingPack();' src/brogue/RogueMain.c
          grep -q 'obrienAddMissionItemToPack(STAFF, STAFF_FIRE, 20);' src/brogue/RogueMain.c
          grep -q 'obrienAddMissionItemToPack(STAFF, STAFF_LIGHTNING, 20);' src/brogue/RogueMain.c
          grep -q 'obrienAddMissionItemToPack(STAFF, STAFF_POISON, 20);' src/brogue/RogueMain.c
          grep -q 'obrienAddMissionItemToPack(STAFF, STAFF_BLINKING, 10);' src/brogue/RogueMain.c
          grep -q 'obrienAddMissionItemToPack(STAFF, STAFF_TUNNELING, 3); // v0.2.13 Tunneling in starting pack' src/brogue/RogueMain.c
          grep -q 'v0.2.14 standard mission rings' src/brogue/RogueMain.c
          grep -q 'obrienAddAndEquipMissionRing(RING_REGENERATION, 3);' src/brogue/RogueMain.c
          grep -q 'obrienAddAndEquipMissionRing(RING_WISDOM, 3);' src/brogue/RogueMain.c
          grep -q 'equipItem(ring, true, NULL);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(RING, RING_REGENERATION, 1, 3, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(RING, RING_WISDOM, 1, 3, anchor);' src/brogue/RogueMain.c
          grep -q '#define OBRIEN_POWER_CELL_CAPACITY 20' src/brogue/Rogue.h
          grep -q '#define OBRIEN_POWER_CELL_TRICKLE_TURNS 100' src/brogue/Rogue.h
          grep -q 'v0.2.15 emergency power cells' src/brogue/RogueMain.c
          test "$(grep -c 'obrienAddEmergencyPowerCellToPack();' src/brogue/RogueMain.c)" -eq 3
          ! grep -q 'obrienAddMissionItemToPack(CHARM, CHARM_RECHARGING, 12);' src/brogue/RogueMain.c
          grep -q 'Starfleet Emergency Power Cell' src/brogue/Items.c
          grep -q 'useObrienEmergencyPowerCell' src/brogue/Items.c
          grep -q 'target->charges += transferred;' src/brogue/Items.c
          grep -q 'cell->charges -= transferred;' src/brogue/Items.c
          grep -q 'tempItem->charges = OBRIEN_POWER_CELL_CAPACITY;' src/brogue/Items.c
          grep -q 'A Scroll of Recharging fills it completely' src/brogue/Items.c
          grep -q 'obrienTrickleChargeEmergencyPowerCells' src/brogue/Time.c
          grep -q 'theItem->enchant2 >= OBRIEN_POWER_CELL_TRICKLE_TURNS' src/brogue/Time.c
          grep -q '&& !(gameVariant == VARIANT_OBRIEN_MUST_SURVIVE && theItem->kind == CHARM_RECHARGING)' src/brogue/Time.c
          grep -q 'v0.2.16 emergency external power' src/brogue/RogueMain.c
          test "$(grep -c 'obrienPlaceSupplyItem(SCROLL, SCROLL_RECHARGING, 1, 0, anchor);' src/brogue/RogueMain.c)" -eq 1
          grep -q "O'Brien Must Survive v0.2.16" src/brogue/RogueMain.c
          grep -q 'v0.2.12 clear stairhead lane' src/brogue/RogueMain.c
          grep -q 'abs(loc.x - anchor.x) > 1 || abs(loc.y - anchor.y) > 1' src/brogue/RogueMain.c
          grep -q 'attempt < 64' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(STAFF, STAFF_TUNNELING, 1, 3, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(STAFF, STAFF_BLINKING, 1, 10, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(STAFF, STAFF_LIGHTNING, 1, 20, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(STAFF, STAFF_FIRE, 1, 20, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(STAFF, STAFF_POISON, 1, 20, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(CHARM, CHARM_RECHARGING, 1, 12, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(POTION, POTION_FIRE_IMMUNITY, 1, 0, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(POTION, POTION_INVISIBILITY, 1, 0, anchor);' src/brogue/RogueMain.c
          ! grep -q 'obrienPlaceSupplyItem(POTION, POTION_HASTE_SELF, 1, 0, anchor);' src/brogue/RogueMain.c
          ! grep -q 'OBRIEN_RECHARGE_KEY' src/brogue/Rogue.h
          ! grep -q 'obrienRechargeCombatStaffs' src/brogue/Items.c
      - name: Compile
        run: make -B -j3 bin/brogue
