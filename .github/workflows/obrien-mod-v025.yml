name: "O'Brien Mod v0.2.9"
on:
  push:
    branches: [ master ]
    paths:
      - 'apply_obrien_mod.py'
      - 'apply_obrien_mod_v0_2_1.py'
      - 'apply_obrien_mod_v0_2_2.py'
      - 'apply_obrien_mod_v0_2_3.py'
      - 'apply_obrien_mod_v0_2_4.py'
      - 'apply_obrien_mod_v0_2_5.py'
      - 'apply_obrien_mod_v0_2_6.py'
      - 'apply_obrien_mod_v0_2_7.py'
      - 'apply_obrien_mod_v0_2_8.py'
      - 'apply_obrien_mod_v0_2_9.py'
      - '.github/workflows/obrien-mod-v025.yml'
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply O'Brien v0.2.9
        run: python3 apply_obrien_mod_v0_2_9.py
      - name: Verify v0.2.9 markers
        run: |
          grep -q 'Full tricorder identification: type, enchantment, runic and curse state' src/brogue/Items.c
          grep -q 'identifyItemKind(theItem);' src/brogue/Items.c
          grep -q 'STAFF_POISON, 1, 20' src/brogue/RogueMain.c
          grep -q 'Bashir carries a finite poison staff' src/brogue/RogueMain.c
          grep -q 'bashir->carriedItem->charges = 20' src/brogue/RogueMain.c
          grep -q 'STAFF_BLINKING, 1, 10' src/brogue/RogueMain.c
          grep -q 'STAFF_LIGHTNING, 1, 20' src/brogue/RogueMain.c
          grep -q 'STAFF_FIRE, 1, 20' src/brogue/RogueMain.c
          grep -q 'return min(20, distance);' src/brogue/PowerTables.c
          grep -q 'MONST_MALE | MONST_MAINTAINS_DISTANCE | MONST_FLIES' src/brogue/RogueMain.c
          grep -q 'obrienFirstVisitToDepth(rogue.depthLevel, rogue.upLoc)' src/brogue/RogueMain.c
          grep -q 'v0.2.9 AoE gas resupply' src/brogue/RogueMain.c
          grep -q 'POTION_POISON, 2, 0' src/brogue/RogueMain.c
          grep -q 'POTION_PARALYSIS, 2, 0' src/brogue/RogueMain.c
          grep -q 'POTION_CONFUSION, 2, 0' src/brogue/RogueMain.c
          grep -q "#define OBRIEN_RECHARGE_KEY 'p'" src/brogue/Rogue.h
          grep -q 'boolean obrienRechargeCombatStaffs(void)' src/brogue/Items.c
          grep -q 'tempItem->kind == STAFF_FIRE' src/brogue/Items.c
          grep -q 'tempItem->kind == STAFF_LIGHTNING' src/brogue/Items.c
          grep -q 'tempItem->kind == STAFF_POISON' src/brogue/Items.c
          grep -q 'tempItem->charges = tempItem->enchant1' src/brogue/Items.c
          grep -q 'case OBRIEN_RECHARGE_KEY:' src/brogue/IO.c
          grep -q 'Recharge combat staffs' src/brogue/IO.c
          grep -q 'recordKeystroke(OBRIEN_RECHARGE_KEY, false, false)' src/brogue/IO.c
      - name: Compile
        run: make -B -j3 bin/brogue
