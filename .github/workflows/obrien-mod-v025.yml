name: "O'Brien Mod v0.2.5"
on:
  push:
    branches: [ master ]
    paths:
      - 'apply_obrien_mod.py'
      - 'apply_obrien_mod_v0_2_1.py'
      - 'apply_obrien_mod_v0_2_2.py'
      - 'apply_obrien_mod_v0_2_3.py'
      - 'apply_obrien_mod_v0_2_4.py'
      - 'apply_obrien_mod_v0_2_5.py'
      - '.github/workflows/obrien-mod-v025.yml'
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply O'Brien v0.2.5
        run: python3 apply_obrien_mod_v0_2_5.py
      - name: Verify v0.2.5 markers
        run: |
          grep -q 'Permanent Starfleet field analysis' src/brogue/RogueMain.c
          grep -q 'identifyItemKind(theItem);' src/brogue/Items.c
          grep -q 'Always-on tricorder scan' src/brogue/Items.c
          grep -q 'STAFF_BLINKING, 1, 10' src/brogue/RogueMain.c
          grep -q 'STAFF_LIGHTNING, 1, 20' src/brogue/RogueMain.c
          grep -q 'STAFF_FIRE, 1, 20' src/brogue/RogueMain.c
          grep -q 'return min(20, distance);' src/brogue/PowerTables.c
          grep -q 'MONST_MALE | MONST_MAINTAINS_DISTANCE | MONST_FLIES' src/brogue/RogueMain.c
          grep -q 'obrienFirstVisitToDepth(rogue.depthLevel, rogue.upLoc)' src/brogue/RogueMain.c
      - name: Compile
        run: make -B -j3 bin/brogue
