name: "Temporary RNG bridge matrix"

on:
  push:
    branches:
      - 'chatgpt/replay-3714-relock'
    paths:
      - '.github/workflows/tmp-rng-bridge.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        burn: [0, 1, 2, 3]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct true original save
        run: |
          set -euo pipefail
          cat tmp_user_save_b64.part00 tmp_user_save_b64.part01 tmp_user_save_b64.part02 \
              tmp_user_save_b64.part03 tmp_user_save_b64.part04 tmp_user_save_b64.part05 \
              tmp_user_save_b64.part06 | base64 -d > user-original.broguesave
          python3 - <<'PY'
          from pathlib import Path
          p=Path("user-original.broguesave")
          b=bytearray(p.read_bytes())
          assert (b[11104], b[11109]) == (105, 71)
          b[11104], b[11109] = 183, 56
          p.write_bytes(b)
          assert len(b) == 20541
          PY

      - name: Apply v0.2.36 and bridge probe
        run: |
          set -euo pipefail
          python3 apply_obrien_mod_v0_2_36.py
          python3 apply_obrien_mod_v0_2_36.py
          python3 tmp_user_save_probe.py
          python3 - <<'PY'
          from pathlib import Path
          burn = int("${{ matrix.burn }}")
          p=Path("src/brogue/Recordings.c")
          s=p.read_text()
          old='''    oldRNG = rogue.RNG;
              rogue.RNG = RNG_SUBSTANTIVE;

          //#ifdef AUDIT_RNG
          //reportRNGState();
          //#endif

              randomNumber = (unsigned long) rand_range(0, 255);'''
          if old not in s:
              old='''    oldRNG = rogue.RNG;
              rogue.RNG = RNG_SUBSTANTIVE;

              randomNumber = (unsigned long) rand_range(0, 255);'''
          if old not in s:
              old='''    oldRNG = rogue.RNG;
              rogue.RNG = RNG_SUBSTANTIVE;

          //#ifdef AUDIT_RNG
          //reportRNGState();
          //#endif

              randomNumber = (unsigned long) rand_range(0, 255);'''
          # Normalize indentation-sensitive anchor by operating on the exact
          # stable two-line tail of RNGCheck instead.
          tail='''    rogue.RNG = RNG_SUBSTANTIVE;

          //#ifdef AUDIT_RNG
          //reportRNGState();
          //#endif

              randomNumber = (unsigned long) rand_range(0, 255);'''
          tail = tail.replace("              randomNumber", "    randomNumber")
          if tail not in s:
              raise SystemExit("RNGCheck anchor not found")
          new=tail.replace(
              "    randomNumber = (unsigned long) rand_range(0, 255);",
              f'''    if (rogue.playbackMode && gameVariant == VARIANT_OBRIEN_MUST_SURVIVE
                  && rogue.playerTurnNumber == 2054) {{
                  for (short obrienBridgeBurn = 0; obrienBridgeBurn < {burn}; obrienBridgeBurn++) {{
                      (void) rand_range(0, 255);
                  }}
              }}
              randomNumber = (unsigned long) rand_range(0, 255);''')
          p.write_text(s.replace(tail,new,1))
          print("burn", burn)
          PY

      - name: Build
        run: make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue

      - name: Strict replay
        shell: bash
        run: |
          set +e
          cp user-original.broguesave strict.broguesave
          OBRIEN_USER_SAVE_PROBE=1 ./bin/brogue --variant obrien -o strict.broguesave > replay.log 2>&1
          rc=$?
          set -e
          echo "BURN=${{ matrix.burn }} RC=$rc"
          grep -E 'Expected RNG|Playback panic|USER_SAVE_OOS|USER_SAVE_RESUMED|USER_SAVE_CONTINUED' replay.log | tail -30 || true
          tail -50 replay.log
