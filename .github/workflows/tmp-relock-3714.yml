name: "Temporary 3714 save relock and strict verify"

on:
  push:
    branches:
      - 'chatgpt/replay-3714-relock'
    paths:
      - '.github/workflows/tmp-relock-3714.yml'
  workflow_dispatch:

jobs:
  relock-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct exact user save
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_user_save_b64.part00 tmp_user_save_b64.part01 tmp_user_save_b64.part02 \
              tmp_user_save_b64.part03 tmp_user_save_b64.part04 tmp_user_save_b64.part05 \
              tmp_user_save_b64.part06 | base64 -d > user-input.broguesave
          test "$(stat -c %s user-input.broguesave)" = "20541"
          echo "6f646658e910f07fa52f83d5edda354f039b64bf303abbe8176b1f9dd5edb021  user-input.broguesave" | sha256sum -c -

      - name: Apply exact v0.2.36 compatibility and probes
        run: |
          set -euo pipefail
          python3 apply_obrien_mod_v0_2_36.py
          python3 apply_obrien_mod_v0_2_36.py
          python3 tmp_hso_boundary_fix.py
          python3 tmp_user_save_probe.py
          python3 tmp_relock_probe.py

      - name: Build headless diagnostic binary
        run: |
          set -euo pipefail
          make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue
          ./bin/brogue --version | tee version.txt
          grep -q "O'Brien Must Survive v0.2.36" version.txt

      - name: Run non-panicking RNG relock pass
        id: relock
        shell: bash
        run: |
          set -uo pipefail
          cp user-input.broguesave probe-source.broguesave
          set +e
          OBRIEN_RELOCK_PROBE=1 OBRIEN_USER_SAVE_PROBE=1 \
            ./bin/brogue --variant obrien -o probe-source.broguesave > relock.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "$rc" > relock.rc
          cat relock.log
          echo "--- diagnostic summary ---"
          grep -E 'RELOCK|USER_SAVE|Event type mismatch|Unrecognized event|Expected RNG|Playback panic|OBRIEN_BOUNDARY' relock.log || true

      - name: Patch every observed RNG checkpoint into a clean copy
        if: steps.relock.outputs.rc == '0'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          src = Path("user-input.broguesave").read_bytes()
          b = bytearray(src)
          text = Path("relock.log").read_text(errors="replace")
          pat = re.compile(r"RELOCK offset=(\d+) turn=(\d+) expected=(\d+) actual=(\d+) bytes=(\d+)")
          rows = []
          for m in pat.finditer(text):
              off, turn, expected, actual, nbytes = map(int, m.groups())
              if nbytes != 1:
                  raise SystemExit(f"unexpected checkpoint width {nbytes} at offset {off}")
              if not (0 <= off < len(b)):
                  raise SystemExit(f"offset out of range: {off}")
              if b[off] != expected:
                  raise SystemExit(
                      f"recorded byte mismatch at offset {off}: file={b[off]} log_expected={expected}"
                  )
              if not (0 <= actual <= 255):
                  raise SystemExit(f"actual RNG byte out of range: {actual}")
              b[off] = actual
              rows.append((off, turn, expected, actual))

          if not rows:
              raise SystemExit("relock pass produced no RNG mismatches")
          if len({r[0] for r in rows}) != len(rows):
              raise SystemExit("duplicate checkpoint offsets in relock log")

          Path("repaired-3714-v036.broguesave").write_bytes(b)
          Path("relock-mismatches.txt").write_text(
              "\n".join(f"offset={o} turn={t} expected={e} actual={a}" for o,t,e,a in rows) + "\n"
          )
          print(f"patched_checkpoints={len(rows)}")
          print(f"first={rows[0]}")
          print(f"last={rows[-1]}")
          print("sha256=" + hashlib.sha256(b).hexdigest())
          PY
          cat relock-mismatches.txt

      - name: Strict replay repaired save and continue one live turn
        if: steps.relock.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          cp repaired-3714-v036.broguesave strict-test.broguesave
          OBRIEN_USER_SAVE_PROBE=1 \
            ./bin/brogue --variant obrien -o strict-test.broguesave > strict.log 2>&1
          cat strict.log
          grep -q 'USER_SAVE_RESUMED turn=3714 target=3714' strict.log
          grep -q 'USER_SAVE_CONTINUED turn=3715 expected=3715' strict.log
          grep -q 'playback=0 recording=1 oos=0' strict.log
          if grep -q 'Expected RNG output' strict.log; then exit 1; fi
          if grep -q 'Playback panic' strict.log; then exit 1; fi
          if grep -q 'USER_SAVE_OOS' strict.log; then exit 1; fi

      - name: Record checksums
        if: steps.relock.outputs.rc == '0'
        run: |
          sha256sum user-input.broguesave repaired-3714-v036.broguesave > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-3714-v036-strict-verified
          path: |
            repaired-3714-v036.broguesave
            relock.log
            strict.log
            relock-mismatches.txt
            checksums.txt
            version.txt
            relock.rc
          if-no-files-found: warn

      - name: Fail if relock could not reach the saved turn
        if: steps.relock.outputs.rc != '0'
        run: exit 1
