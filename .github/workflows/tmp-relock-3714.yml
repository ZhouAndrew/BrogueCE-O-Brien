name: "Temporary 3714 first-divergence diagnostic"

on:
  push:
    branches:
      - 'chatgpt/replay-3714-relock'
    paths:
      - '.github/workflows/tmp-relock-3714.yml'
      - 'tmp_rng2054_diag.py'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct exact user save
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_user_save_b64.part00 tmp_user_save_b64.part01 tmp_user_save_b64.part02 \
              tmp_user_save_b64.part03 tmp_user_save_b64.part04 tmp_user_save_b64.part05 \
              tmp_user_save_b64.part06 | base64 -d > user-input.broguesave
          test "$(stat -c %s user-input.broguesave)" = "20541"
          echo "6f646658e910f07fa52f83d5edda354f039b64bf303abbe8176b1f9dd5edb021  user-input.broguesave" | sha256sum -c -

      - name: Apply v0.2.36 compatibility and diagnostics
        run: |
          set -euo pipefail
          python3 apply_obrien_mod_v0_2_36.py
          python3 apply_obrien_mod_v0_2_36.py
          python3 tmp_hso_boundary_fix.py
          python3 tmp_user_save_probe.py
          python3 tmp_rng2054_diag.py

      - name: Build headless diagnostic binary
        run: |
          set -euo pipefail
          make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue
          ./bin/brogue --version | tee version.txt
          grep -q "O'Brien Must Survive v0.2.36" version.txt

      - name: Run strict replay to first divergence
        shell: bash
        run: |
          set +e
          cp user-input.broguesave strict-source.broguesave
          OBRIEN_RNG_DIAG=1 OBRIEN_USER_SAVE_PROBE=1 \
            ./bin/brogue --variant obrien -o strict-source.broguesave > diagnostic.log 2>&1
          rc=$?
          set -e
          echo "$rc" > diagnostic.rc
          cat diagnostic.log
          echo "--- focused diagnostic ---"
          grep -E 'RNG_AFTER|RNG_PEEK|RNG_CALL|Expected RNG|USER_SAVE_OOS|OBRIEN_BOUNDARY' diagnostic.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3714-first-divergence-diagnostic
          path: |
            diagnostic.log
            diagnostic.rc
            version.txt
          if-no-files-found: error
