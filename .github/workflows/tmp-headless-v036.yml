name: "Temporary O'Brien v0.2.36 turn-2054 RNG probe"

on:
  push:
    branches:
      - 'chatgpt/obrien-v0.2.36-headless-test'
  workflow_dispatch:

jobs:
  build-headless:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact v0.2.36
        run: |
          python3 apply_obrien_mod_v0_2_36.py
          python3 apply_obrien_mod_v0_2_36.py
      - name: Reconstruct full historical process boundary
        run: python3 tmp_hso_boundary_fix.py
      - name: Add generic replay probe
        run: python3 tmp_user_save_probe.py
      - name: Add RNG diagnostic
        run: python3 tmp_rng2054_diag.py
      - name: Add non-panicking relock probe
        run: python3 tmp_relock_probe.py
      - name: Build null-console diagnostic binary
        run: |
          make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue
          ./bin/brogue --version | tee headless-version.txt
          grep -q "O'Brien Must Survive v0.2.36" headless-version.txt
          tar -czf generated-source.tar.gz src Makefile config.mk make tools
      - uses: actions/upload-artifact@v4
        with:
          name: obrien-v036-rng2054-probe-linux
          path: |
            bin/brogue
            headless-version.txt
            generated-source.tar.gz
