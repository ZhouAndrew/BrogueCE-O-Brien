name: "Temporary 2054 automap boundary matrix"

on:
  push:
    branches:
      - 'chatgpt/replay-3714-relock'
    paths:
      - '.github/workflows/tmp-2054-automap.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, noapply, nocont, nomap, resetcont]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct true original save
        run: |
          set -euo pipefail
          cat tmp_user_save_b64.part00 tmp_user_save_b64.part01 tmp_user_save_b64.part02 \
              tmp_user_save_b64.part03 tmp_user_save_b64.part04 tmp_user_save_b64.part05 \
              tmp_user_save_b64.part06 | base64 -d > user.broguesave
          python3 - <<'PY'
          from pathlib import Path
          p=Path("user.broguesave"); b=bytearray(p.read_bytes())
          assert (b[11104],b[11109]) == (105,71)
          b[11104],b[11109] = 183,56
          p.write_bytes(b)
          PY
      - name: Apply v0.2.36 and probe
        run: |
          set -euo pipefail
          python3 apply_obrien_mod_v0_2_36.py
          python3 apply_obrien_mod_v0_2_36.py
          python3 tmp_user_save_probe.py
          python3 - <<'PY'
          from pathlib import Path
          mode="${{ matrix.mode }}"
          if mode=="baseline":
              raise SystemExit(0)
          p=Path("src/brogue/Recordings.c")
          s=p.read_text()
          start=s.find("case SAVED_GAME_LOADED:")
          if start < 0:
              raise SystemExit("saved-game case missing")
          end=s.find("break;", start)
          if end < 0:
              raise SystemExit("saved-game case end missing")
          block=s[start:end]
          call="obrienAutoApplyMagicMappingScroll(false);"
          cont="obrienAutoMapContinuation = true;"
          if call not in block or cont not in block:
              print(block)
              raise SystemExit("automap statements missing in saved-game case")
          if mode=="noapply":
              block=block.replace(call,"/* diagnostic: skip boundary map apply */",1)
          elif mode=="nocont":
              block=block.replace(cont,"obrienAutoMapContinuation = false;",1)
          elif mode=="nomap":
              block=block.replace(cont,"obrienAutoMapContinuation = false;",1)
              block=block.replace(call,"/* diagnostic: skip boundary map apply */",1)
          elif mode=="resetcont":
              block=block.replace(cont,"obrienAutoMapContinuation = false;",1)
              block=block.replace(call,call+"\\n                    obrienAutoMapContinuation = true;",1)
          else:
              raise SystemExit(mode)
          s=s[:start]+block+s[end:]
          p.write_text(s)
          print("mode",mode)
          PY
      - name: Build
        run: make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue
      - name: Replay
        shell: bash
        run: |
          set +e
          OBRIEN_USER_SAVE_PROBE=1 ./bin/brogue --variant obrien -o user.broguesave > replay.log 2>&1
          rc=$?
          set -e
          echo "MODE=${{ matrix.mode }} RC=$rc"
          grep -E 'Expected RNG|USER_SAVE_OOS|USER_SAVE_RESUMED|USER_SAVE_CONTINUED' replay.log | tail -20 || true
