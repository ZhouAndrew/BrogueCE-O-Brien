name: Debug RNG callers
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/debug-rng-callers.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply O'Brien v0.2.23
        run: python3 apply_obrien_mod_v0_2_23.py
      - name: Collect v0.2.23 source and RNG call sites
        run: |
          mkdir -p artifact
          {
            echo '=== RNGCheck callers ==='
            grep -R -n -C 8 'RNGCheck[[:space:]]*(' src/brogue || true
            echo
            echo '=== OOSCheck callers ==='
            grep -R -n -C 8 'OOSCheck[[:space:]]*(' src/brogue || true
            echo
            echo '=== playerTurnEnded definition ==='
            grep -n -A 430 -B 20 '^void playerTurnEnded' src/brogue/Time.c || true
            echo
            echo '=== RogueMain RNGCheck context ==='
            grep -n -A 50 -B 50 'RNGCheck();' src/brogue/RogueMain.c || true
          } > artifact/rng-callers.txt
          cp -a src/brogue artifact/brogue-v023-source
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rng-callers-v023-source
          path: artifact
