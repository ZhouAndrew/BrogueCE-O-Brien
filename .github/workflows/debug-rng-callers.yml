name: Debug RNG callers
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/debug-rng-callers.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply O'Brien v0.2.23
        run: python3 apply_obrien_mod_v0_2_23.py
      - name: Collect RNG call sites
        run: |
          mkdir -p artifact
          {
            echo '=== RNGCheck callers ==='
            grep -R -n -C 4 'RNGCheck[[:space:]]*(' src/brogue || true
            echo
            echo '=== OOSCheck callers ==='
            grep -R -n -C 4 'OOSCheck[[:space:]]*(' src/brogue || true
            echo
            echo '=== playerTurnEnded callers/context ==='
            grep -R -n -C 4 'playerTurnEnded[[:space:]]*(' src/brogue || true
          } > artifact/rng-callers.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rng-callers-v023
          path: artifact/rng-callers.txt
