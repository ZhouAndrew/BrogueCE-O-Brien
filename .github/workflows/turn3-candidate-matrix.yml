name: Turn3 candidate action matrix

on:
  push:
    branches:
      - fix/longsave-turn3-replay
    paths:
      - '.github/workflows/turn3-candidate-matrix.yml'
      - 'forensic_candidate_probe.py'
      - 'forensic_turnloop_probe.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - turn
          - rest
          - rest2
          - searched
          - automation
          - cautious
          - undisturbed
          - search30
          - search60
          - search160
          - stairsdown
          - stairsup
          - move0
          - move1
          - move2
          - move3
          - move4
          - move5
          - move6
          - move7
          - run0
          - run1
          - run2
          - run3
          - run4
          - run5
          - run6
          - run7
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.2.23
        run: python3 apply_obrien_mod_v0_2_23.py
      - name: Inject candidate diagnostics
        run: |
          python3 forensic_candidate_probe.py
          python3 forensic_turnloop_probe.py
      - name: Build null-console binary
        run: make -B -j3 GRAPHICS=NO bin/brogue
      - name: Probe candidate
        shell: bash
        run: |
          set +e
          OBRIEN_FORENSIC_ACTION="${{ matrix.action }}"             ./bin/brogue --variant obrien -o demo/OBrien_3727turn_longsave_backup.broguesave             > "candidate-${{ matrix.action }}.log" 2>&1
          code=$?
          cat "candidate-${{ matrix.action }}.log"
          echo "CANDIDATE_EXIT action=${{ matrix.action }} code=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: turn3-${{ matrix.action }}
          path: candidate-${{ matrix.action }}.log
