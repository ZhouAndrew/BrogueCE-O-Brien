name: Forensic historical v22 v23 null builds
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/forensic-history-v22-v23.yml'
      - 'forensic_history_outcome.py'

jobs:
  v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_obrien_mod_v0_2_22.py
      - run: python3 forensic_history_outcome.py
      - run: make -B -j3 GRAPHICS=NO bin/brogue
      - run: mkdir -p artifact && cp bin/brogue artifact/brogue-v0.2.22
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-history-v0.2.22
          path: artifact
  v23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_obrien_mod_v0_2_23.py
      - run: python3 forensic_history_outcome.py
      - run: make -B -j3 GRAPHICS=NO bin/brogue
      - run: mkdir -p artifact && cp bin/brogue artifact/brogue-v0.2.23
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-history-v0.2.23
          path: artifact
