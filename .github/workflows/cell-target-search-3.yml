name: Power-cell target search 3

on:
  push:
    branches:
      - fix/longsave-turn3-replay
    paths:
      - '.github/workflows/cell-target-search-3.yml'
      - 'forensic_cell_target_selector.py'
      - 'forensic_missing_c_replay.py'
      - 'diag_longsave_matrix.py'
  workflow_dispatch:

jobs:
  third-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [e, f, g, h, i]
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_obrien_mod_v0_2_28.py
      - run: python3 forensic_missing_c_replay.py
      - run: python3 forensic_cell_target_selector.py
      - run: python3 diag_longsave_matrix.py
      - run: make -B -j3 GRAPHICS=NO bin/brogue
      - name: Replay candidate
        shell: bash
        run: |
          set +e
          OBRIEN_FORENSIC_CELL_TARGETS="ef${{ matrix.target }}"           OBRIEN_MATRIX_DIAG=1             ./bin/brogue --variant obrien -o demo/OBrien_3727turn_longsave_backup.broguesave             > "target3-${{ matrix.target }}.log" 2>&1
          code=$?
          tail -140 "target3-${{ matrix.target }}.log"
          echo "TARGET3_RESULT target=ef${{ matrix.target }} code=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: third-cell-target-ef${{ matrix.target }}
          path: target3-${{ matrix.target }}.log
