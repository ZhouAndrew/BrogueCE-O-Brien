name: Forensic legacy save re-encoder
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'forensic_reencode_legacy_save.py'
      - 'forensic_reencode_event_source_fix.py'
      - 'forensic_migration_nullconsole.py'
      - '.github/workflows/forensic-reencode-save.yml'

jobs:
  reencoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply clean OBrien v0.2.28
        run: python3 apply_obrien_mod_v0_2_28.py
      - name: Inject one-shot re-encoder
        run: |
          python3 forensic_reencode_legacy_save.py
          python3 forensic_reencode_event_source_fix.py
          python3 forensic_migration_nullconsole.py
      - name: Compile
        run: make -B -j3 bin/brogue
      - name: Package
        run: |
          mkdir -p artifact/bin
          cp bin/brogue artifact/bin/brogue-reencode-v028
          cp -a bin/assets artifact/bin/
          cp src/brogue/Recordings.c artifact/Recordings.reencode.c
          cp src/platform/main.c artifact/main.reencode.c
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-reencode-v028
          path: artifact

  clean-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply untouched OBrien v0.2.28
        run: python3 apply_obrien_mod_v0_2_28.py
      - name: Compile untouched null-console v0.2.28 with debug symbols
        run: make -B -j3 GRAPHICS=NO CFLAGS='-g -O0' bin/brogue
      - name: Package clean verifier
        run: |
          mkdir -p clean-artifact
          cp bin/brogue clean-artifact/brogue-clean-v028
          cat > clean-artifact/VERIFY_WITH_GDB.txt <<'EOF'
          This binary is clean O'Brien v0.2.28 source: no migration or replay patch is applied.
          It is built with GRAPHICS=NO and -g -O0 only, so GDB can inspect state without changing replay logic.

          For the migrated save, stop at switchToPlaying(). loadSavedGame() reaches that function only
          after replay completes without gameHasEnded/playbackOOS. Inspect:
            rogue.playerTurnNumber == 3727
            player.currentHP > 0
            rogue.gameHasEnded == 0
            rogue.playbackOOS == 0

          Also set a breakpoint on playbackPanic; hitting it is an immediate verification failure.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: clean-v028-gdb-verifier
          path: clean-artifact
