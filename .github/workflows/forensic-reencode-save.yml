name: Forensic legacy save re-encoder
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'forensic_reencode_legacy_save.py'
      - 'forensic_migration_nullconsole.py'
      - '.github/workflows/forensic-reencode-save.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply clean OBrien v0.2.28
        run: python3 apply_obrien_mod_v0_2_28.py
      - name: Inject one-shot re-encoder
        run: |
          python3 forensic_reencode_legacy_save.py
          python3 forensic_migration_nullconsole.py
      - name: Compile
        run: make -B -j3 bin/brogue
      - name: Package
        run: |
          mkdir -p artifact/bin
          cp bin/brogue artifact/bin/brogue-reencode-v028
          cp -a bin/assets artifact/bin/
          cp src/brogue/Recordings.c artifact/Recordings.reencode.c
          cp src/platform/main.c artifact/main.reencode.c
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-reencode-v028
          path: artifact
