name: "Temporary ruleset35 compat-flag matrix"

on:
  push:
    branches:
      - 'chatgpt/replay-3714-relock'
    paths:
      - '.github/workflows/tmp-compat-matrix.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        version: [35, 36]
        compat: [0, 1]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct source
        run: |
          set -euo pipefail
          cat tmp_user_save_b64.part00 tmp_user_save_b64.part01 tmp_user_save_b64.part02 \
              tmp_user_save_b64.part03 tmp_user_save_b64.part04 tmp_user_save_b64.part05 \
              tmp_user_save_b64.part06 | base64 -d > user.broguesave
          python3 - <<'PY'
          from pathlib import Path
          p=Path("user.broguesave"); b=bytearray(p.read_bytes())
          assert (b[11104],b[11109])==(105,71)
          b[11104],b[11109]=183,56
          b[13]=int("${{ matrix.compat }}")
          p.write_bytes(b)
          print("compat",b[13],"ruleset",b[14],"turns",int.from_bytes(b[24:28],"big"))
          PY
      - name: Apply engine
        run: |
          set -euo pipefail
          if [ "${{ matrix.version }}" = 35 ]; then
            python3 apply_obrien_mod_v0_2_35.py
          else
            python3 apply_obrien_mod_v0_2_36.py
          fi
          python3 tmp_user_save_probe.py
          make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue
      - name: Replay
        shell: bash
        run: |
          set +e
          OBRIEN_USER_SAVE_PROBE=1 ./bin/brogue --variant obrien -o user.broguesave > replay.log 2>&1
          rc=$?
          set -e
          echo "VERSION=${{ matrix.version }} COMPAT=${{ matrix.compat }} RC=$rc"
          grep -E 'Expected RNG|USER_SAVE_OOS|USER_SAVE_RESUMED|USER_SAVE_CONTINUED' replay.log | tail -20 || true
