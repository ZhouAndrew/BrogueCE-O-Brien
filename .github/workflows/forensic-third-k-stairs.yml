name: Forensic third-k stairs
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/forensic-third-k-stairs.yml'
      - 'forensic_third_k_stairs_patch.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply OBrien v0.2.23
        run: python3 apply_obrien_mod_v0_2_23.py
      - name: Inject third-k probe
        run: python3 forensic_third_k_stairs_patch.py
      - name: Compile
        run: make -B -j3 bin/brogue
      - name: Package
        run: |
          mkdir -p artifact/bin
          cp bin/brogue artifact/bin/brogue-forensic-third-k
          cp -a bin/assets artifact/bin/
          cp brogue artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-third-k-v023
          path: artifact
