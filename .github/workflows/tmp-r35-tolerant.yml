name: "Temporary legacy ruleset35 tolerant replay"

on:
  push:
    branches:
      - 'chatgpt/replay-3714-relock'
    paths:
      - '.github/workflows/tmp-r35-tolerant.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct true original save
        run: |
          set -euo pipefail
          cat tmp_user_save_b64.part00 tmp_user_save_b64.part01 tmp_user_save_b64.part02 \
              tmp_user_save_b64.part03 tmp_user_save_b64.part04 tmp_user_save_b64.part05 \
              tmp_user_save_b64.part06 | base64 -d > user.broguesave
          python3 - <<'PY'
          from pathlib import Path
          p=Path("user.broguesave"); b=bytearray(p.read_bytes())
          assert (b[11104],b[11109])==(105,71)
          b[11104],b[11109]=183,56
          p.write_bytes(b)
          assert len(b)==20541
          PY
      - name: Apply v0.2.36 and tolerant ruleset35 bridge
        run: |
          set -euo pipefail
          python3 apply_obrien_mod_v0_2_36.py
          python3 apply_obrien_mod_v0_2_36.py
          python3 tmp_hso_boundary_fix.py
          python3 tmp_user_save_probe.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/brogue/Recordings.c")
          s=p.read_text()
          start=s.index("            } else if (recordedNumber != x) {")
          end=s.index("            }\n        }\n    } else {", start) + len("            }")
          old=s[start:end]
          new='''            } else if (recordedNumber != x) {
                if (gameVariant == VARIANT_OBRIEN_MUST_SURVIVE
                    && obrienStrictReplayRuleset35()
                    && numberOfBytes == 1) {
                    static unsigned long obrienLegacyMismatchCount = 0;
                    obrienLegacyMismatchCount++;
                    if (obrienLegacyMismatchCount <= 20 || obrienLegacyMismatchCount % 250 == 0) {
                        printf("OBRIEN_R35_TOLERATE mismatch=%lu turn=%li expected=%lu got=%lu loc=%li\\n",
                               obrienLegacyMismatchCount, rogue.playerTurnNumber,
                               recordedNumber, x, recordingLocation);
                        fflush(stdout);
                    }
                } else {
                    printf("Expected RNG output of %li; got %i.\\n", recordedNumber, (int) x);
                    playbackPanic();
                }
            }'''
          p.write_text(s[:start] + new + s[end:])
          PY
          make -B -j3 GRAPHICS=NO DEBUG=YES bin/brogue
          ./bin/brogue --version | tee version.txt
      - name: Replay and continue
        shell: bash
        run: |
          set +e
          cp user.broguesave strict-test.broguesave
          OBRIEN_USER_SAVE_PROBE=1 ./bin/brogue --variant obrien -o strict-test.broguesave > replay.log 2>&1
          rc=$?
          set -e
          echo "RC=$rc"
          grep -E 'OBRIEN_R35_TOLERATE|Expected RNG|Playback panic|USER_SAVE_|Unrecognized event|Event type mismatch' replay.log | tail -120 || true
          tail -80 replay.log
          test "$rc" = 0
          grep -q 'USER_SAVE_RESUMED turn=3714 target=3714' replay.log
          grep -q 'USER_SAVE_CONTINUED turn=3715 expected=3715' replay.log
          grep -q 'playback=0 recording=1 oos=0' replay.log
          ! grep -q 'Playback panic' replay.log
          ! grep -q 'USER_SAVE_OOS' replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r35-tolerant-replay
          path: |
            replay.log
            strict-test.broguesave
            version.txt
          if-no-files-found: warn
