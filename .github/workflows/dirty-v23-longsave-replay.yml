name: Dirty-v23 exact long-save replay

on:
  push:
    branches:
      - fix/longsave-turn3-replay
    paths:
      - '.github/workflows/dirty-v23-longsave-replay.yml'
      - 'forensic_v23_delta_only.py'
      - 'diag_longsave_matrix.py'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v22 to partial-v23 dirty tree
        shell: bash
        run: |
          python3 apply_obrien_mod_v0_2_22.py
          set +e
          python3 apply_obrien_mod_v0_2_23.py | tee v23-partial.log
          echo "V23_CHAIN_EXIT=$?"
          set -e
          python3 forensic_v23_delta_only.py
      - name: Inject strict replay diagnostics
        run: python3 diag_longsave_matrix.py
      - name: Build null-console binary
        run: make -B -j3 GRAPHICS=NO bin/brogue
      - name: Replay exact historical save
        shell: bash
        run: |
          set +e
          OBRIEN_MATRIX_DIAG=1 ./bin/brogue --variant obrien -o demo/OBrien_3727turn_longsave_backup.broguesave 2>&1 | tee dirty-v23-replay.log
          code=$?
          echo "DIRTY_V23_REPLAY_EXIT=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dirty-v23-longsave-replay
          path: |
            v23-partial.log
            dirty-v23-replay.log
