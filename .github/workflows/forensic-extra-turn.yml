name: Forensic in-place v22 to v23
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/forensic-extra-turn.yml'
      - 'forensic_extra_turn_patch.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Build already-patched history
        run: |
          python3 apply_obrien_mod_v0_2_22.py
          python3 apply_obrien_mod_v0_2_23.py || true
          git diff -- src/brogue > in_place_v22_to_v23.diff
      - name: Inject forensic replay
        run: python3 forensic_extra_turn_patch.py
      - name: Compile
        run: make -B -j3 bin/brogue
      - name: Package
        run: |
          mkdir -p artifact/bin
          cp bin/brogue artifact/bin/brogue-forensic-v22-to-v23
          cp -a bin/assets artifact/bin/
          cp brogue artifact/
          cp in_place_v22_to_v23.diff artifact/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: forensic-v22-to-v23-in-place
          path: artifact
