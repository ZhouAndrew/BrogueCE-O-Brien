name: Forensic historical replay matrix
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/forensic-extra-turn.yml'
      - 'forensic_extra_turn_patch.py'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version: ['18','19','20','21','22','23']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libsdl2-dev libsdl2-image-dev
      - name: Apply historical OBrien version
        run: python3 apply_obrien_mod_v0_2_${{ matrix.version }}.py
      - name: Inject forensic replay
        run: python3 forensic_extra_turn_patch.py
      - name: Compile
        run: make -B -j3 bin/brogue
      - name: Package
        run: |
          mkdir -p artifact/bin
          cp bin/brogue artifact/bin/brogue-forensic-v${{ matrix.version }}
          cp -a bin/assets artifact/bin/
          cp brogue artifact/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: forensic-v0-2-${{ matrix.version }}
          path: artifact
