name: "Automap Full Test"
on:
  pull_request:
    branches:
    - 'master'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
    - name: "Install dependencies"
      run: |
        sudo apt update -y
        sudo apt install -y libsdl2-dev libsdl2-image-dev

    - name: "Checkout sources"
      uses: actions/checkout@v5

    - name: "Compile normal release configuration"
      run: |
        make -j3 bin/brogue

    - name: "Verify generated dungeon catalogs are unchanged"
      run: |
        python3 test/compare_seed_catalog.py test/seed_catalogs/seed_catalog_brogue.txt 40
        python3 test/compare_seed_catalog.py --extra_args "--variant rapid_brogue" test/seed_catalogs/seed_catalog_rapid_brogue.txt 10
        python3 test/compare_seed_catalog.py --extra_args "--variant bullet_brogue" test/seed_catalogs/seed_catalog_bullet_brogue.txt 5

    - name: "Compile with automap runtime assertions and revisit checks"
      run: |
        make -B -j3 CFLAGS="-DBROGUE_AUTOMAP_TEST -DBROGUE_AUTOMAP_REVISIT_TEST" bin/brogue

    - name: "Exercise 1,375 generated levels plus revisits with assertions"
      run: |
        ./bin/brogue --print-seed-catalog 1 25 40 >/tmp/catalog-ce.txt
        ./bin/brogue --variant rapid_brogue --print-seed-catalog 1 25 10 >/tmp/catalog-rb.txt
        ./bin/brogue --variant bullet_brogue --print-seed-catalog 1 25 5 >/tmp/catalog-bb.txt
        test -s /tmp/catalog-ce.txt
        test -s /tmp/catalog-rb.txt
        test -s /tmp/catalog-bb.txt

  sanitizer:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v5

    - name: "Compile null-console ASan/UBSan assertion build"
      run: |
        make -B -j3 GRAPHICS=NO CFLAGS="-DBROGUE_AUTOMAP_TEST -DBROGUE_AUTOMAP_REVISIT_TEST -fsanitize=address,undefined -fno-omit-frame-pointer" LDLIBS="-fsanitize=address,undefined" bin/brogue

    - name: "ASan/UBSan automap exercise"
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        ./bin/brogue --print-seed-catalog 1 10 26 >/tmp/asan-ce.txt
        ./bin/brogue --variant rapid_brogue --print-seed-catalog 1 10 10 >/tmp/asan-rb.txt
        ./bin/brogue --variant bullet_brogue --print-seed-catalog 1 10 5 >/tmp/asan-bb.txt
        test -s /tmp/asan-ce.txt
        test -s /tmp/asan-rb.txt
        test -s /tmp/asan-bb.txt
